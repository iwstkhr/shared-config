# Shared pre-commit config template for all repositories.
# Copy it into each repository; Renovate keeps the rev values up to date.
# Pin each rev to a commit SHA with a "# frozen: <tag>" comment so Renovate updates both.
# Hooks with no matching files are skipped, so unused hooks can stay in place.
# See README.md for per-repository adjustments, such as excluding generated files.
# Install both hook types so the commit-msg hook runs: pre-commit install
default_install_hook_types: [pre-commit, commit-msg]
# Limit hooks to the pre-commit stage unless a hook declares its own stage,
# so committing does not run every hook again on the commit-msg stage
default_stages: [pre-commit]

repos:
  ##########################################################
  # Base configs
  ##########################################################
  # General file fixers and syntax checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      # Change to [--unsafe] for YAML with custom tags, such as CloudFormation
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
        exclude: \.svg$
      - id: trailing-whitespace
        exclude: \.svg$

  # Lint GitHub Actions workflows
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint

  # Check commit messages against Conventional Commits (commit-msg stage)
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8 # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit

  # Detect secrets such as API keys and tokens
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  # Static analysis for security issues and bugs
  - repo: https://github.com/semgrep/pre-commit
    rev: 51a77ed8e8899262edd0674395baba66cc64b0aa # frozen: v1.182.0
    hooks:
      - id: semgrep
        # args replace the hook defaults, so keep --skip-unknown-extensions and the others here
        # --error makes findings fail the commit; the ruleset is fetched from the Semgrep Registry on each run
        args: [--config, p/default, --error, --skip-unknown-extensions, --disable-version-check, --quiet]

  # Lint Markdown
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 916ad0aaa108c64d294101002066f530ea170b10 # frozen: v0.23.3
    hooks:
      - id: markdownlint-cli2

  # Run local tools, such as the ones pinned in mise.toml
  - repo: local
    hooks:
      # Lint shell scripts
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
      # Scan dependencies for vulnerabilities and IaC for misconfigurations
      - id: trivy
        name: trivy
        entry: trivy fs
        language: system
        # Trivy scans the whole repository, so run once per commit instead of per file
        pass_filenames: false
        always_run: true
        # Secret scanning is left to gitleaks; the last arg is the path to scan
        # Trivy ignores .gitignore, so skip installed dependencies explicitly
        args: [--exit-code, "1", --scanners, "vuln,misconfig", --severity, "HIGH,CRITICAL", --skip-dirs, "**/node_modules", --skip-dirs, "**/.venv", --quiet, .]

  ##########################################################
  # Language configs
  ##########################################################
  # Lint JavaScript and TypeScript files with Biome
  - repo: https://github.com/biomejs/pre-commit
    rev: 5090c1e080cc8cec15feee68a9355c0f660d3712 # frozen: v2.5.15
    hooks:
      - id: biome-check

  # Lint and format Python files with Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730 # frozen: v0.17.1
    hooks:
      - id: ruff-check
        # --extend-select S adds the flake8-bandit security rules on top of the repository's Ruff config
        args: [--fix, --extend-select, S]
      - id: ruff-format
