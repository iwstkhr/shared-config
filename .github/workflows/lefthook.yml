# Reusable workflow that runs every lefthook pre-commit job against all files.
# Other repositories call it with:
#   uses: iwstkhr/shared-config/.github/workflows/lefthook.yml@main
# See README.md for the full caller example.
name: "repo - Lefthook"

on:
  workflow_call:
    secrets:
      SLACK_BOT_TOKEN:
        description: Slack bot token for failure notifications. Notifications are skipped when omitted
        required: false
      SLACK_CHANNEL_ID:
        description: ID of the Slack channel for failure notifications. Notifications are skipped when omitted
        required: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lefthook:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    outputs:
      # Job-level if conditions cannot read secrets, so expose only whether Slack is configured
      slack-enabled: ${{ secrets.SLACK_BOT_TOKEN != '' && secrets.SLACK_CHANNEL_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # lefthook and every tool its jobs run come from the calling repository's mise.toml
      - name: Setup mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          # Match minimumReleaseAge in the Renovate preset
          minimum_release_age: 7d

      # Install the Git hooks so lefthook fetches the remote configs, then run the pre-commit jobs on every file
      # fail_on_changes in the shared config fails the run when a fixer changes a file, and prints the diff in CI
      # Trivy's DB is not cached: restoring a cache takes longer on this runner than downloading,
      # and the download overlaps with semgrep in the parallel checks group
      - name: Run lefthook
        run: |
          lefthook install
          lefthook run pre-commit --all-files

  notify:
    name: Notify
    needs: lefthook
    if: ${{ failure() && needs.lefthook.outputs.slack-enabled == 'true' }}
    # Reference this repository explicitly so the call resolves the same way from every caller
    uses: iwstkhr/shared-config/.github/workflows/slack-notify.yml@main
    with:
      status: ${{ needs.lefthook.result }}
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
