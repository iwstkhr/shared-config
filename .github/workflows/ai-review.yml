# Reusable workflow that reviews a pull request with Claude Code, Codex, and Cursor when the `ai-review` label is added.
# Other repositories call it with:
#   uses: iwstkhr/shared-config/.github/workflows/ai-review.yml@main
# See README.md for the full caller example.
name: "repo - AI Review"

on:
  workflow_call:
    inputs:
      label:
        description: Label that triggers the review
        type: string
        required: false
        default: ai-review
      allowed_bots:
        description: Comma-separated bot usernames allowed to trigger the review by adding the label
        type: string
        required: false
        default: renovate[bot]
      extra_prompt:
        description: Additional instructions appended to the review prompt
        type: string
        required: false
        default: ""
      enable_claude:
        description: Review with Claude Code. The review is also skipped when neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is set
        type: boolean
        required: false
        default: true
      enable_codex:
        description: Review with Codex. The review is also skipped when OPENAI_API_KEY is not set
        type: boolean
        required: false
        default: true
      enable_cursor:
        description: Review with Cursor. The review is also skipped when CURSOR_API_KEY is not set
        type: boolean
        required: false
        default: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: Claude Code OAuth token from `claude setup-token`. Set this or ANTHROPIC_API_KEY
        required: false
      ANTHROPIC_API_KEY:
        description: Anthropic API key. Set this or CLAUDE_CODE_OAUTH_TOKEN
        required: false
      OPENAI_API_KEY:
        description: OpenAI API key for the Codex review. The Codex review is skipped when this is not set
        required: false
      CURSOR_API_KEY:
        description: Cursor API key for the Cursor review. The Cursor review is skipped when this is not set
        required: false
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  # Adding any label starts a run, so a pull request that gets several labels at once has several runs.
  # The review jobs in runs for other labels are skipped, but their check runs would hide the real results
  # when they share the same names. This job decides whether to review, and the review jobs change their
  # names in runs that do not review.
  gate:
    name: Check label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      review: ${{ steps.check.outputs.review }}
    steps:
      - name: Check the label
        id: check
        # The github context belongs to the caller. Inputs are empty when this repository runs the workflow directly.
        # Pull requests from forks are skipped because they cannot read the secrets.
        env:
          REVIEW: >-
            ${{
              github.event_name == 'pull_request'
              && github.event.action == 'labeled'
              && github.event.label.name == (inputs.label || 'ai-review')
              && github.event.pull_request.head.repo.full_name == github.repository
            }}
        run: echo "review=$REVIEW" >> "$GITHUB_OUTPUT"

  claude:
    name: ${{ needs.gate.outputs.review == 'true' && 'Claude' || 'Claude (not requested)' }}
    needs: gate
    # toJSON() treats a missing input as enabled, since `null == false` is true in expressions.
    if: needs.gate.outputs.review == 'true' && toJSON(inputs.enable_claude) != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ai-review-claude-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # Exchanged for a Claude GitHub App token
      id-token: write
    steps:
      - name: Check Claude credentials
        id: key
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is set, so the Claude review is skipped"
          fi

      - name: Checkout
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # Keep the credentials: claude-code-action runs `git fetch` for the PR branch
          # before it configures its own auth, which fails on private repositories.
          persist-credentials: true

      - name: Review with Claude Code
        if: steps.key.outputs.present == 'true'
        uses: anthropics/claude-code-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64 # v1.0.240
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: ${{ inputs.allowed_bots || 'renovate[bot]' }}
          # Post a tracking comment that shows progress and holds the summary
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Focus on:

            1. Correctness: bugs, edge cases, and error handling
            2. Security: vulnerabilities, secret exposure, and unsafe input handling
            3. Breaking changes: for dependency updates, check the release notes and whether this repository's usage is affected
            4. Maintainability: readability, and whether tests and documentation follow the change

            Use inline comments for specific issues, and summarize the overall assessment in the tracking comment.
            Do not comment on style issues that linters already catch.

            ${{ inputs.extra_prompt }}
          # claude-code-action posts comments itself, so this job needs write permissions.
          # Limit the tools instead, so a prompt injection cannot do more than read the PR, fetch web pages, and comment on it.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),WebFetch"

  codex:
    name: ${{ needs.gate.outputs.review == 'true' && 'Codex' || 'Codex (not requested)' }}
    needs: gate
    if: needs.gate.outputs.review == 'true' && toJSON(inputs.enable_codex) != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ai-review-codex-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # Codex gets a read-only token. The codex-comment job posts its result.
    # Codex reads untrusted pull request content, so a prompt injection cannot use the token to write to the repository.
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.codex.outputs.final-message }}
    steps:
      - name: Check OpenAI API key
        id: key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::OPENAI_API_KEY is not set, so the Codex review is skipped"
          fi

      - name: Checkout
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          # Fetch the full history so the base and head commits are available without credentials
          fetch-depth: 0
          persist-credentials: false

      - name: Review with Codex
        id: codex
        if: steps.key.outputs.present == 'true'
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1.13
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":read-only"
          allow-bot-users: ${{ inputs.allowed_bots || 'renovate[bot]' }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review only the changes introduced by this pull request:
              git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}

            Focus on:

            1. Correctness: bugs, edge cases, and error handling
            2. Security: vulnerabilities, secret exposure, and unsafe input handling
            3. Breaking changes: for dependency updates, check whether this repository's usage is affected
            4. Maintainability: readability, and whether tests and documentation follow the change

            Reply in Markdown with the overall assessment followed by specific issues, each with its file and line.
            Do not comment on style issues that linters already catch.

            ${{ inputs.extra_prompt }}

  codex-comment:
    name: ${{ needs.gate.outputs.review == 'true' && 'Codex comment' || 'Codex comment (not requested)' }}
    needs: [gate, codex]
    if: needs.codex.outputs.final_message != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Post the Codex review
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        # Pass the review through an environment variable so its content is never run as script code
        env:
          REVIEW: ${{ needs.codex.outputs.final_message }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## Codex review\n\n${process.env.REVIEW}`,
            });

  cursor:
    name: ${{ needs.gate.outputs.review == 'true' && 'Cursor' || 'Cursor (not requested)' }}
    needs: gate
    if: needs.gate.outputs.review == 'true' && toJSON(inputs.enable_cursor) != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ai-review-cursor-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # Cursor gets a read-only token. The cursor-comment job posts its result.
    # Cursor reads untrusted pull request content and its CLI comes from an unpinned installer,
    # so neither can use the token to write to the repository.
    permissions:
      contents: read
    outputs:
      review: ${{ steps.cursor.outputs.review }}
    steps:
      - name: Check Cursor API key
        id: key
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -n "$CURSOR_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CURSOR_API_KEY is not set, so the Cursor review is skipped"
          fi

      - name: Checkout
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          # Fetch the full history so the base and head commits are available without credentials
          fetch-depth: 0
          persist-credentials: false

      # Cursor runs in ask mode, which cannot run shell commands, so write the diff to a file beforehand
      - name: Write the diff
        if: steps.key.outputs.present == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/pr.diff"

      # The official installer always installs the latest version and publishes no checksum, so it cannot be pinned
      - name: Install Cursor CLI
        if: steps.key.outputs.present == 'true'
        run: |
          curl -fsS -o "$RUNNER_TEMP/cursor-install.sh" https://cursor.com/install
          bash "$RUNNER_TEMP/cursor-install.sh"
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Review with Cursor
        id: cursor
        if: steps.key.outputs.present == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          PROMPT: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review only the changes introduced by this pull request.
            The diff is in ${{ runner.temp }}/pr.diff, and the merged code is checked out in the workspace.

            Focus on:

            1. Correctness: bugs, edge cases, and error handling
            2. Security: vulnerabilities, secret exposure, and unsafe input handling
            3. Breaking changes: for dependency updates, check whether this repository's usage is affected
            4. Maintainability: readability, and whether tests and documentation follow the change

            Reply in Markdown with the overall assessment followed by specific issues, each with its file and line.
            Do not comment on style issues that linters already catch.

            ${{ inputs.extra_prompt }}
        # The json output joins every assistant message, including progress notes between tool calls,
        # without separators, which breaks Markdown headings. Keep only the messages after the last tool call.
        run: |
          review=$(agent -p --trust --mode ask --output-format stream-json "$PROMPT" | jq -rs '
            (map(.type == "tool_call") | rindex(true) // -1) as $last
            | .[$last + 1:]
            | map(select(.type == "assistant") | .message.content[]? | select(.type == "text") | .text)
            | join("")
          ')
          delimiter="EOF_$(openssl rand -hex 8)"
          {
            echo "review<<$delimiter"
            echo "$review"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  cursor-comment:
    name: ${{ needs.gate.outputs.review == 'true' && 'Cursor comment' || 'Cursor comment (not requested)' }}
    needs: [gate, cursor]
    if: needs.cursor.outputs.review != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Post the Cursor review
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        # Pass the review through an environment variable so its content is never run as script code
        env:
          REVIEW: ${{ needs.cursor.outputs.review }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## Cursor review\n\n${process.env.REVIEW}`,
            });
