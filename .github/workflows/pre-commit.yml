# Reusable workflow that runs every pre-commit hook against all files.
# Other repositories call it with:
#   uses: iwstkhr/shared-config/.github/workflows/pre-commit.yml@main
# See README.md for the full caller example.
name: "repo - Pre-commit"

on:
  workflow_call:
    secrets:
      SLACK_BOT_TOKEN:
        description: Slack bot token for failure notifications. Notifications are skipped when omitted
        required: false
      SLACK_CHANNEL_ID:
        description: ID of the Slack channel for failure notifications. Notifications are skipped when omitted
        required: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    outputs:
      # Job-level if conditions cannot read secrets, so expose only whether Slack is configured
      slack-enabled: ${{ secrets.SLACK_BOT_TOKEN != '' && secrets.SLACK_CHANNEL_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # semgrep fails on Python 3.15; return to 3.x once it supports 3.15
          # (and drop the matching allowedVersions rule in renovate-preset.json)
          python-version: "3.14"

      # Repositories with mise.toml get the tools it pins, which hooks may rely on
      - name: Setup mise
        if: hashFiles('mise.toml') != ''
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          # Match minimumReleaseAge in the Renovate preset
          minimum_release_age: 7d

      # Prefer the pre-commit pinned in mise.toml, and fall back to pip otherwise
      - name: Install pre-commit
        env:
          # Keep in sync with mise.toml; Renovate updates both
          # renovate: datasource=pypi depName=pre-commit
          PRE_COMMIT_VERSION: 4.7.0
        run: |
          if command -v mise >/dev/null && mise which pre-commit >/dev/null 2>&1; then
            echo "Using pre-commit from mise.toml"
          else
            python -m pip install "pre-commit==${PRE_COMMIT_VERSION}"
          fi
          pre-commit --version

      # When the config or mise.toml changes, restore the previous environments so that only the changed hooks are reinstalled
      # After a Python patch update, fall back to a cache from the previous version; pre-commit reinstalls only the broken Python environments
      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml', 'mise.toml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-
            pre-commit-${{ runner.os }}-

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --color=always

      # Drop environments of hook versions no longer in the config so the restored cache does not keep growing
      - name: Remove unused pre-commit environments
        run: pre-commit gc

  notify:
    name: Notify
    needs: pre-commit
    if: ${{ failure() && needs.pre-commit.outputs.slack-enabled == 'true' }}
    # Reference this repository explicitly so the call resolves the same way from every caller
    uses: iwstkhr/shared-config/.github/workflows/slack-notify.yml@main
    with:
      status: ${{ needs.pre-commit.result }}
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
