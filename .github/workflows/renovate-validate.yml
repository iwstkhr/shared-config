# Validates the shared Renovate preset and this repository's Renovate config.
name: Renovate Validate

on:
  pull_request:
    paths:
      - renovate-preset.json
      - renovate.json
      - .github/workflows/renovate-validate.yml
  push:
    branches: [main]
    paths:
      - renovate-preset.json
      - renovate.json
      - .github/workflows/renovate-validate.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      # The hosted Renovate app always runs the latest release, so validate with it too.
      # --no-global validates the files as repo config instead of self-hosted global config.
      # --strict also fails when the config uses options that need migration.
      - name: Run renovate-config-validator
        run: npx --yes --package renovate -- renovate-config-validator --strict --no-global renovate-preset.json renovate.json
